<section class="testimonials px-6 py-40">
  <h2 class="text-5xl font-bold text-center px-10">What Our Attendees Are Saying</h2>

  <div class="sr-only" id="slideshow-instructions">
    Press the "P" key to pause or resume the slideshow.
  </div>

  <div class="testimonial-list-wrapper">
    <button class="testimonial-arrow left" aria-label="Previous testimonial">
      &#10094;
    </button>

    <div class="testimonial-list" id="testimonial-slideshow"
         aria-describedby="slideshow-instructions">

      {% for t in testimonials %}
        <div class="testimonial-item">
          <p>"{{ t.review }}"</p>
          <p>
            <strong>
              — {{ t.name }}
            </strong>
          </p>
        </div>
      {% empty %}
        <p>No testimonials yet.</p>
      {% endfor %}

    </div>

    <button class="testimonial-arrow right" aria-label="Next testimonial">
      &#10095;
    </button>
  </div>

  <div class="testimonial-dots"></div>
</section>

<style>
.testimonials {
  text-align: center;
  align-items: center;
  display: flex;
  flex-direction: column;
  gap: 2rem;
  overflow-x: hidden;
}
.testimonial-list {
  position: relative;
  width: 100%;
  max-width:90%;
  height: 30rem;
  overflow: visible;
  margin: 0 auto;
  display: flex;
  justify-content: center;
  align-items: center;
}
.testimonial-item {
  position: absolute;
  max-height: 100%;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: center;
  width: 80%;
  max-width: 600px;
  transition: transform 0.5s ease, opacity 0.5s ease;
  text-align: center;
  padding: 1rem;
  border-radius: 10px;
  background-color: #EBC5FF;
  top: 50%;
  left: 10%;
  transform: translate(-50%, -50%) scale(0.8);
  opacity: 0;
  z-index: 1;
  overflow-y:auto;
}
.testimonial-item.current {
  opacity: 1;
  transform: translate(0%, -50%) scale(1);
  z-index: 3;
}
.testimonial-item.prev {
  opacity: 0.5;
  transform: translate(-100%, -50%) scale(0.8);
  z-index: 2;
}
.testimonial-item.next {
  opacity: 0.5;
  transform: translate(100%, -50%) scale(0.8);
  z-index: 2;
}
.testimonial-item.out-left {
  transform: translateX(-100vw) scale(0.8);
  opacity: 0;
  z-index: 0;
}
.testimonial-item.out-right {
  transform: translateX(100vw) scale(0.8);
  opacity: 0;
  z-index: 0;
}
.testimonial-item p {
  font-size: 1rem;
  padding-bottom: 1rem;
}
.testimonial-dots {
  display: flex;
  justify-content: center;
  gap: 0.5rem;
}
.testimonial-dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background-color: #bbb;
  cursor: pointer;
  transition: background-color 0.3s;
}
.testimonial-dot.active {
  background-color: #5D1982;
}
.testimonial-list-wrapper {
  position: relative;
  width: 100%;
  max-width: 700px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
}
.testimonial-arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  font-size: 2rem;
  background: none;
  border: none;
  color: #5D1982;
  cursor: pointer;
  z-index: 1000;
  padding: 0.5rem;
  transition: color 0.3s;
}
.testimonial-arrow:hover {
  color: #420264;
}
.testimonial-arrow.left {
  left: -10rem;
}
.testimonial-arrow.right {
  right: -10rem;
}


@media (max-width: 768px) {
  .testimonial-list {
    height: 30rem;
    overflow-y: hidden;
    overflow-x: hidden;
  }

  .testimonial-item {
    width: 95%;
    left: 2.5%;
    transform: translate(-50%, -50%) scale(1);
    font-size: 0.2rem;
  }

  .testimonial-arrow.left {
    left: 0;
  }

  .testimonial-arrow.right {
    right: 0;
  }
}
</style>


<script>

// Generate testimonials on page load
document.addEventListener('DOMContentLoaded', () => {
  startTestimonialSlideshow();
});

function startTestimonialSlideshow() {
  // Select DOM elements: testimonials, dots container, and arrows
  const items = document.querySelectorAll('.testimonial-item');
  const dotsContainer = document.querySelector('.testimonial-dots');
  const leftArrow = document.querySelector('.testimonial-arrow.left');
  const rightArrow = document.querySelector('.testimonial-arrow.right');

  // Keep track of the current visible testimonial
  let current = 0;

  // Reference to the auto-advance interval timer
  let interval;

  // Pause flag for keyboard toggle
  let paused = false;

  // If no testimonials exist, stop here
  if (items.length === 0) return;

  // Create navigation dots dynamically based on number of testimonials
  items.forEach((_, i) => {
    const dot = document.createElement('span');
    dot.classList.add('testimonial-dot');

    // Clicking a dot jumps to that testimonial
    dot.addEventListener('click', () => {
      current = i;             // Update the index
      updateClasses();         // Update visible classes
      restartInterval();       // Reset slideshow timer
    });

    dotsContainer.appendChild(dot); // Add dot to the DOM
  });

  // After creating dots, select them all for class updates
  const dots = document.querySelectorAll('.testimonial-dots .testimonial-dot');

  // Updates visible testimonial and neighboring positions
  function updateClasses() {
    // Reset all testimonial classes
    items.forEach((item) => item.className = 'testimonial-item');

    // Compute indexes for neighbors
    const prevIndex = (current - 1 + items.length) % items.length;
    const nextIndex = (current + 1) % items.length;
    const outLeftIndex = (current - 2 + items.length) % items.length;
    const outRightIndex = (current + 2) % items.length;

    // Add directional classes for styling animations/transitions
    items[outLeftIndex].classList.add('out-left');
    items[prevIndex].classList.add('prev');
    items[current].classList.add('current');
    items[nextIndex].classList.add('next');
    items[outRightIndex].classList.add('out-right');

    // Highlight the active dot
    dots.forEach((dot, i) => {
      dot.classList.toggle('active', i === current);
    });
  }

  // Restart the auto-slide interval (clears and restarts)
  function restartInterval() {
    clearInterval(interval);
    if (!paused) {  // Only restart if not paused
      interval = setInterval(() => {
        current = (current + 1) % items.length;
        updateClasses();
      }, 15000);
    }
  }

  // ========== ARROW NAVIGATION ==========
  if (leftArrow && rightArrow) {
    // Left arrow: go to previous testimonial
    leftArrow.addEventListener('click', () => {
      current = (current - 1 + items.length) % items.length;
      updateClasses();
      restartInterval(); // Reset the interval
    });

    // Right arrow: go to next testimonial
    rightArrow.addEventListener('click', () => {
      current = (current + 1) % items.length;
      updateClasses();
      restartInterval(); // Reset the interval
    });
  }

  // ========== TOUCH SWIPE SUPPORT (MOBILE) ==========

  let touchStartX = null; // Track starting position of touch

  // Save the X-coordinate where the touch started
  const handleTouchStart = (e) => {
    touchStartX = e.touches[0].clientX;
  };

  // Compare start and end touch X to determine swipe direction
  const handleTouchEnd = (e) => {
    if (touchStartX === null) return;

    const touchEndX = e.changedTouches[0].clientX;
    const diff = touchStartX - touchEndX;

    // If the swipe was significant enough (e.g. > 50px)
    if (Math.abs(diff) > 50) {
      if (diff > 0) {
        // Swiped left → Next testimonial
        current = (current + 1) % items.length;
      } else {
        // Swiped right → Previous testimonial
        current = (current - 1 + items.length) % items.length;
      }

      updateClasses();
      restartInterval(); // Reset interval after manual change
    }

    touchStartX = null; // Reset touch tracker
  };

  // Apply swipe detection to the testimonial container
  const testimonialContainer = document.querySelector('.testimonial-list');
  if (testimonialContainer) {
    testimonialContainer.addEventListener('touchstart', handleTouchStart);
    testimonialContainer.addEventListener('touchend', handleTouchEnd);
  }

  // 🛠️ Add keyboard listener for 'P' to pause/resume
  document.addEventListener('keydown', (e) => {
    if (e.key.toLowerCase() === 'p') {
      paused = !paused;

      if (paused) {
        clearInterval(interval);
      } else {
        restartInterval();
      }
    }
  });

  // Initialize with accessible instruction (screen reader only)
  const existingInstructions = document.getElementById('slideshow-instructions');
  if (!existingInstructions) {
    const instructions = document.createElement('div');
    instructions.id = 'slideshow-instructions';
    instructions.className = 'sr-only';
    instructions.textContent = 'Press the P key to pause or resume the testimonial slideshow.';
    testimonialContainer?.insertAdjacentElement('beforebegin', instructions);
  }

  // Add aria-describedby to slideshow container
  const slideshowWrapper = document.querySelector('.testimonials');
  if (slideshowWrapper) {
    slideshowWrapper.setAttribute('aria-describedby', 'slideshow-instructions');
  }

  // ========== INITIALIZE SLIDESHOW ==========
  updateClasses();     // Set initial visible testimonial
  restartInterval();   // Start auto-cycling
}


</script>
