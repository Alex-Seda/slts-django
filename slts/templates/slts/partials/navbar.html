{% load static %}

<!-- NAVBAR -->
<nav class="fixed top-0 left-0 w-full bg-c_dark_purple/95 backdrop-blur-md text-white z-50 border-b border-purple-900/40 shadow-md">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 sm:py-4 flex items-center justify-between gap-4 sm:gap-8">

    <!-- Logo & Brand (Never shrink, never overlap) -->
    <a href="{% url 'slts:home' %}" class="flex items-center gap-3 sm:gap-3.5 flex-shrink-0 group py-1">
      <img src="{% static 'images/favicon.ico' %}" class="h-9 sm:h-10 w-auto rounded-lg shadow-xs group-hover:scale-105 transition-transform" alt="SLTS Logo">
      <span class="text-lg sm:text-xl lg:text-2xl font-bold tracking-tight text-white group-hover:text-purple-200 transition-colors whitespace-nowrap">
        Senior Living Truth Series
      </span>
    </a>

    <!-- Desktop Navigation (Displayed on xl screens 1280px+ with ample breathing room) -->
    <div class="hidden xl:flex items-center gap-1 2xl:gap-2 text-sm 2xl:text-base font-medium flex-shrink-0">
      <a href="{% url 'slts:home' %}" class="px-3 py-2 rounded-xl hover:bg-c_purple hover:text-white transition-colors duration-150 whitespace-nowrap">Home</a>
      
      <!-- 2026 Schedules Dropdown -->
      <div class="relative group inline-block">
        <button type="button" class="px-3 py-2 rounded-xl hover:bg-c_purple hover:text-white transition-colors duration-150 inline-flex items-center gap-1.5 cursor-pointer whitespace-nowrap">
          <span>2026 Schedules</span>
          <svg class="w-4 h-4 text-purple-200 group-hover:rotate-180 transition-transform duration-200 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
          </svg>
        </button>

        <!-- Dropdown Menu -->
        <div class="absolute left-0 top-full pt-1.5 hidden group-hover:block w-56 z-50">
          <div class="bg-c_dark_purple border border-purple-400/30 rounded-2xl shadow-2xl overflow-hidden py-1.5 backdrop-blur-md">
            <a href="{% url 'slts:schedule' 'seminars' %}" class="block px-4 py-2.5 text-sm hover:bg-c_purple hover:text-white transition-colors">Seminars</a>
            <a href="{% url 'slts:schedule' 'tours' %}" class="block px-4 py-2.5 text-sm hover:bg-c_purple hover:text-white transition-colors">Tours</a>
            <a href="{% url 'slts:schedule' 'expert-insights' %}" class="block px-4 py-2.5 text-sm hover:bg-c_purple hover:text-white transition-colors">Expert Insights</a>
          </div>
        </div>
      </div>
      
      <!-- Recordings Dropdown -->
      <div class="relative group inline-block">
        <button type="button" class="px-3 py-2 rounded-xl hover:bg-c_purple hover:text-white transition-colors duration-150 inline-flex items-center gap-1.5 cursor-pointer whitespace-nowrap">
          <span>Recordings</span>
          <svg class="w-4 h-4 text-purple-200 group-hover:rotate-180 transition-transform duration-200 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
          </svg>
        </button>

        <!-- Dropdown Menu -->
        <div class="absolute left-0 top-full pt-1.5 hidden group-hover:block w-48 z-50">
          <div class="bg-c_dark_purple border border-purple-400/30 rounded-2xl shadow-2xl overflow-hidden py-1.5 backdrop-blur-md">
            <a href="{% url 'slts:recordings' 2026 %}" class="block px-4 py-2.5 text-sm hover:bg-c_purple hover:text-white transition-colors">2026</a>
            <a href="{% url 'slts:recordings' 2025 %}" class="block px-4 py-2.5 text-sm hover:bg-c_purple hover:text-white transition-colors">2025</a>
            <a href="{% url 'slts:recordings' 2024 %}" class="block px-4 py-2.5 text-sm hover:bg-c_purple hover:text-white transition-colors">2024</a>
          </div>
        </div>
      </div>

      <a href="https://www.facebook.com/SLTSOKC/" target="_blank" rel="noopener noreferrer" class="px-3 py-2 rounded-xl hover:bg-c_purple hover:text-white transition-colors duration-150 whitespace-nowrap">Facebook</a>
      <a href="{% url 'slts:education_partners' %}" class="px-3 py-2 rounded-xl hover:bg-c_purple hover:text-white transition-colors duration-150 whitespace-nowrap">Education Partners</a>
      <a href="{% url 'slts:about' %}" class="px-3 py-2 rounded-xl hover:bg-c_purple hover:text-white transition-colors duration-150 whitespace-nowrap">About Us</a>
    </div>

    <!-- Mobile Menu Button (Visible below xl screens) -->
    <button id="menu-btn"
            class="xl:hidden p-2.5 rounded-xl hover:bg-c_purple text-white focus:outline-none focus:ring-2 focus:ring-purple-300 transition-colors cursor-pointer flex-shrink-0"
            aria-label="Open menu">
      <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>

  </div>
</nav>

<!-- BACKDROP -->
<div id="backdrop"
     class="fixed inset-0 bg-black/60 backdrop-blur-xs hidden z-40 transition-opacity"></div>

<!-- MOBILE SIDEBAR -->
<div id="sidebar"
     class="
       fixed top-0 right-0 h-full w-80 max-w-[85vw]
       bg-c_dark_purple text-white
       transform translate-x-full
       transition-transform duration-300 ease-in-out
       z-50 shadow-2xl border-l border-purple-800/40
       xl:hidden flex flex-col justify-between overflow-y-auto
     ">

  <div class="px-6 py-6 flex flex-col gap-2 text-lg">

    <!-- Header & Close Button -->
    <div class="flex items-center justify-between pb-4 border-b border-purple-800/50 mb-2">
      <span class="font-bold text-lg text-purple-200">Navigation</span>
      <button id="close-btn"
              class="p-2 text-white hover:bg-c_purple rounded-xl transition-colors cursor-pointer"
              aria-label="Close menu">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <a href="{% url 'slts:home' %}" class="hover:bg-c_purple px-4 py-3 rounded-xl transition-colors">Home</a>
    
    <!-- Schedules Dropdown -->
    <div class="flex flex-col">
      <button id="schedules-btn"
              class="flex justify-between items-center w-full px-4 py-3 hover:bg-c_purple rounded-xl focus:outline-none transition-colors cursor-pointer">
        <span>2026 Schedules</span>
        <svg id="schedules-chevron" class="w-5 h-5 transition-transform" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
        </svg>
      </button>

      <div id="schedules-submenu" class="flex flex-col ml-4 mt-1 space-y-1 hidden border-l-2 border-purple-600/50 pl-2">
        <a href="{% url 'slts:schedule' 'seminars' %}" class="px-4 py-2 hover:bg-c_purple rounded-xl transition-colors text-base">Seminars</a>
        <a href="{% url 'slts:schedule' 'tours' %}" class="px-4 py-2 hover:bg-c_purple rounded-xl transition-colors text-base">Tours</a>
        <a href="{% url 'slts:schedule' 'expert-insights' %}" class="px-4 py-2 hover:bg-c_purple rounded-xl transition-colors text-base">Expert Insights</a>
      </div>
    </div>
    
    <!-- Recordings Dropdown -->
    <div class="flex flex-col">
      <button id="recordings-btn"
              class="flex justify-between items-center w-full px-4 py-3 hover:bg-c_purple rounded-xl focus:outline-none transition-colors cursor-pointer">
        <span>Recordings</span>
        <svg id="recordings-chevron" class="w-5 h-5 transition-transform" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
        </svg>
      </button>

      <div id="recordings-submenu" class="flex flex-col ml-4 mt-1 space-y-1 hidden border-l-2 border-purple-600/50 pl-2">
        <a href="{% url 'slts:recordings' 2026 %}" class="px-4 py-2 hover:bg-c_purple rounded-xl transition-colors text-base">2026</a>
        <a href="{% url 'slts:recordings' 2025 %}" class="px-4 py-2 hover:bg-c_purple rounded-xl transition-colors text-base">2025</a>
        <a href="{% url 'slts:recordings' 2024 %}" class="px-4 py-2 hover:bg-c_purple rounded-xl transition-colors text-base">2024</a>
      </div>
    </div>

    <a href="https://www.facebook.com/SLTSOKC/" target="_blank" rel="noopener noreferrer" class="hover:bg-c_purple px-4 py-3 rounded-xl transition-colors">Facebook</a>
    <a href="{% url 'slts:education_partners' %}" class="hover:bg-c_purple px-4 py-3 rounded-xl transition-colors">Education Partners</a>
    <a href="{% url 'slts:about' %}" class="hover:bg-c_purple px-4 py-3 rounded-xl transition-colors">About Us</a>

  </div>

  <div class="p-6 text-xs text-purple-300/80 border-t border-purple-800/40">
    Senior Living Truth Series
  </div>
</div>

<script>
  const menuBtn = document.getElementById('menu-btn');
  const closeBtn = document.getElementById('close-btn');
  const sidebar = document.getElementById('sidebar');
  const backdrop = document.getElementById('backdrop');

  const schedulesBtn = document.getElementById('schedules-btn');
  const schedulesSubmenu = document.getElementById('schedules-submenu');
  const schedulesChevron = document.getElementById('schedules-chevron');

  const recordingsBtn = document.getElementById('recordings-btn');
  const recordingsSubmenu = document.getElementById('recordings-submenu');
  const recordingsChevron = document.getElementById('recordings-chevron');

  function openMenu() {
    sidebar.classList.remove('translate-x-full');
    backdrop.classList.remove('hidden');
    document.body.classList.add('overflow-hidden');
  }

  function closeMenu() {
    sidebar.classList.add('translate-x-full');
    backdrop.classList.add('hidden');
    document.body.classList.remove('overflow-hidden');
  }

  function toggleSchedulesSubMenu() {
    schedulesSubmenu.classList.toggle('hidden');
    schedulesChevron.classList.toggle('rotate-180');
  }

  function toggleRecordingsSubMenu() {
    recordingsSubmenu.classList.toggle('hidden');
    recordingsChevron.classList.toggle('rotate-180');
  }

  menuBtn.addEventListener('click', openMenu);
  closeBtn.addEventListener('click', closeMenu);
  backdrop.addEventListener('click', closeMenu);

  schedulesBtn.addEventListener('click', toggleSchedulesSubMenu);
  recordingsBtn.addEventListener('click', toggleRecordingsSubMenu);
</script>
