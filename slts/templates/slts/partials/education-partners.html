<section class="bg-white py-20">
  <h2 class="text-6xl text-center font-bold text-gray-900 mb-12">
    Education Partners
  </h2>

  <div class="flex flex-wrap justify-center gap-8">
    {% for partner in education_partners %}
      <div class="w-32 sm:w-40 md:w-48 lg:w-56 flex items-center justify-center">
        <img src="{{ partner.image.url }}" alt="{{ partner.name }}" class="object-contain h-24 sm:h-28 md:h-32">
      </div>
    {% endfor %}
  </div>
</section>
