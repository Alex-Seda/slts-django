<section class="bg-white py-20 overflow-hidden w-screen">
  <h2 class="text-6xl text-center font-bold text-gray-900 mb-12">
    Education Partners
  </h2>

  <div class="relative w-full overflow-hidden">
    <div class="flex animate-marquee will-change-transform">
      {% for partner in education_partners %}
      <a class="flex-shrink-0 w-48 mx-8 flex items-center justify-center" href="{{ partner.url }}" target="_blank">
          <img src="{{ partner.image.url }}" alt="{{ partner.name }}" class="object-contain h-24">
      </a>
      {% endfor %}
      {% for partner in education_partners %}
      <a class="flex-shrink-0 w-48 mx-8 flex items-center justify-center" href="{{ partner.url }}" target="_blank">
          <img src="{{ partner.image.url }}" alt="{{ partner.name }}" class="object-contain h-24">
      </a>
      {% endfor %}
    </div>
  </div>

  <style>
    @keyframes marquee {
      from {
        transform: translateX(0);
      }
      to {
        transform: translateX(-50%);
      }
    }
    
    .animate-marquee {
      animation: marquee 60s linear infinite;
      width: max-content;
    }
    
    .animate-marquee:hover {
      animation-play-state: paused;
    }
  </style>
</section>
