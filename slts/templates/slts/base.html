<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{% block title %}{% endblock %} | Senior Living Truth Series</title>

  {% load static %}
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  <link rel="icon" type="image/x-icon" class="rounded-md" href="{% static 'images/favicon.ico' %}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <!-- For Education Partner Carousel -->
  <link href="https://unpkg.com/flowbite@1.7.0/dist/flowbite.min.css" rel="stylesheet">
  <script src="https://unpkg.com/flowbite@1.7.0/dist/flowbite.js"></script>
</head>

<body class="min-h-screen flex flex-col font-sans bg-gray-50 text-gray-900">

  {% include "slts/partials/navbar.html" %}

  <main class="flex-grow max-w-7xl mx-auto px-6 py-10">
    {% block content %}{% endblock %}
  </main>

  {% include "slts/partials/footer.html" %}

</body>
</html>
